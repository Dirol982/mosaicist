<meta charset="utf-8">

<meta name="robots" content="noindex,nofollow">
<title>Реестр сайтов студии</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: рабочая панель — сводка сверху, слева список сайтов, справа карточка сайта: гейты двух фреймворков и задачи по гейтам */
:root{
  --bg:#eef0f3; --surface:#ffffff; --sunk:#f5f6f8; --fg:#151a24; --muted:#5d6574; --line:#dcdfe5;
  --ink:#1e3a8a;
  --red:#c42b2b; --red-bg:#fde8e8; --orange:#c25e00; --orange-bg:#feefdc; --green:#1b7f47; --green-bg:#e2f3e9; --grey:#8a919e; --grey-bg:#eceef1;
  --f-body:"Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e121a; --surface:#161c27; --sunk:#121722; --fg:#e7eaf0; --muted:#98a0ae; --line:#283041;
  --ink:#8fa8ff;
  --red:#ff7676; --red-bg:#3b1a1d; --orange:#ffad5c; --orange-bg:#3a2813; --green:#5fd394; --green-bg:#13301f; --grey:#7c8494; --grey-bg:#1f2533; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e121a; --surface:#161c27; --sunk:#121722; --fg:#e7eaf0; --muted:#98a0ae; --line:#283041;
  --ink:#8fa8ff;
  --red:#ff7676; --red-bg:#3b1a1d; --orange:#ffad5c; --orange-bg:#3a2813; --green:#5fd394; --green-bg:#13301f; --grey:#7c8494; --grey-bg:#1f2533; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-size:18px;font-weight:700}
h3{margin:0;font-size:13px;font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.red{background:var(--red)}.dot.orange{background:var(--orange)}.dot.green{background:var(--green)}.dot.grey{background:var(--grey)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer}
.tile b{font:600 26px/1.1 var(--f-mono)}
.tile span{font-size:12px;color:var(--muted)}
.tile.red b{color:var(--red)}.tile.orange b{color:var(--orange)}.tile.green b{color:var(--green)}
.tile:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.sites{display:flex;flex-direction:column}
.sites-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.site-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.site-item:last-child{border-bottom:0}
.site-item[aria-current="true"]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--ink)}
.site-item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-item .sub{grid-column:2/4;font-size:12px;color:var(--muted)}
.badge{font:600 11px/1 var(--f-mono);padding:4px 6px;border-radius:4px;background:var(--grey-bg);color:var(--muted)}
.counts{display:flex;gap:6px}
.cnt{font:600 11px/1 var(--f-mono);padding:3px 6px;border-radius:999px}
.cnt.red{background:var(--red-bg);color:var(--red)}.cnt.orange{background:var(--orange-bg);color:var(--orange)}
.site{display:flex;flex-direction:column;gap:0}
.site-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;justify-content:space-between}
.site-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.site-meta a{color:var(--ink)}
.rails{display:grid;grid-template-columns:1fr;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.rail{display:flex;flex-direction:column;gap:6px}
.rail-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.gate{border:1px solid var(--line);border-radius:6px;padding:7px 8px;display:flex;flex-direction:column;gap:3px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.gate .g{font:600 11px/1 var(--f-mono);color:var(--muted)}
.gate .t{font-size:12px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gate .p{font:500 11px/1 var(--f-mono);color:var(--muted)}
.gate.done{background:var(--green-bg);border-color:var(--green)}
.gate.done .g{color:var(--green)}
.gate.red{border-color:var(--red);box-shadow:inset 0 3px 0 var(--red)}
.gate.orange{border-color:var(--orange);box-shadow:inset 0 3px 0 var(--orange)}
.gate.green{border-color:var(--green);box-shadow:inset 0 3px 0 var(--green)}
.gate.empty{opacity:.55}
.gate.current .g::after{content:" · сейчас";color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.groups{display:flex;flex-direction:column}
.fw-title{padding:14px 18px 6px;font:600 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.group{padding:0 18px 10px}
.group-head{display:flex;align-items:center;gap:10px;padding:8px 0 6px;border-bottom:1px solid var(--line)}
.group-head .p{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:9px 0 9px 10px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.task:last-child{border-bottom:0}
.task.red{border-left-color:var(--red);background:linear-gradient(90deg,var(--red-bg),transparent 40%)}
.task.orange{border-left-color:var(--orange);background:linear-gradient(90deg,var(--orange-bg),transparent 40%)}
.task.green{border-left-color:var(--green)}
.task.done{border-left-color:var(--grey)}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task input[type=checkbox]{width:18px;height:18px;margin:1px 0 0;accent-color:var(--green);cursor:pointer}
.task .body{display:flex;flex-direction:column;gap:3px;min-width:0}
.task .title{overflow-wrap:anywhere}
.task .info{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);align-items:center}
.status{font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:4px;white-space:nowrap}
.status.red{background:var(--red-bg);color:var(--red)}.status.orange{background:var(--orange-bg);color:var(--orange)}.status.green{background:var(--green-bg);color:var(--green)}.status.done{background:var(--grey-bg);color:var(--muted)}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.date{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:2px 4px;font:12px var(--f-mono);width:128px}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 7px;font-size:12px;cursor:pointer;color:var(--muted)}
.icon.on{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.icon.danger{color:var(--red)}
.btn.danger{color:var(--red);border-color:var(--red)}
.add{padding:14px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:0 0 10px 10px}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form input[type=text],.form input[type=url],.form select,.form input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0}
.form .grow{flex:1 1 220px}
.btn{border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.note{padding:12px 14px;font-size:13px;color:var(--muted)}
.empty{padding:28px 18px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}
.siteform{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.siteform input,.siteform select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;width:100%}
@media (max-width:900px){.main{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.rail-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.task{grid-template-columns:22px minmax(0,1fr)}.actions{grid-column:2;justify-content:flex-start}}
@media (prefers-reduced-motion:no-preference){.task,.gate{transition:background .2s,border-color .2s}}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;border-radius:6px;padding:5px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--sunk);color:var(--fg);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:12px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.chk input{width:auto}
.siteform{border-bottom:1px solid var(--line);border-top:0}
.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pstatus{font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:4px;background:var(--green-bg);color:var(--green)}
.pstatus.paused{background:var(--grey-bg);color:var(--muted)}
.pstatus.done{background:var(--sunk);color:var(--ink)}
.pstatus.archived{background:var(--grey-bg);color:var(--muted)}
.head-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.head-actions .btn{padding:5px 10px;font-size:13px}
.banner{padding:10px 18px;background:var(--grey-bg);border-bottom:1px solid var(--line);font-size:13px;display:flex;flex-wrap:wrap;gap:4px}
.inline-form{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--sunk)}
.inline-form input,.inline-form select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0;flex:1 1 160px}
.inline-form .grow{flex:3 1 260px}
.closed{color:var(--green)}
.cnt.grey{background:var(--grey-bg);color:var(--muted)}
.status.paused{background:var(--grey-bg);color:var(--muted)}
.task.paused{border-left-color:var(--grey)}
.history{border-top:1px solid var(--line);padding:12px 18px}
.history summary{cursor:pointer;font-weight:600;font-size:13px}
.hist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.hist li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;font-size:13px}

.prio{font:600 11px/1 var(--f-mono);padding:3px 6px;border-radius:4px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.prio.P1{border-color:var(--red);color:var(--red)}.prio.P2{border-color:var(--orange);color:var(--orange)}
.rev{font:600 11px/1 var(--f-mono);padding:3px 6px;border-radius:4px;background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.card{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 16px;font-size:13px}
.card>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.card .k,.card-edit .k{font-size:11px;color:var(--muted)}
.card .v{overflow-wrap:anywhere}
.card .v.red{color:var(--red);font-weight:600}.card .v.orange{color:var(--orange);font-weight:600}.card .v.none{color:var(--muted)}
.card .warn{grid-column:1/-1;color:var(--red);font-size:12px}
.card-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 12px;width:100%}
.card-edit label{display:flex;flex-direction:column;gap:2px;min-width:0}
.card-edit input{width:100%;flex:none!important}
.regbox{border-bottom:1px solid var(--line)}
.regbox summary{cursor:pointer;padding:10px 18px;font-weight:600;font-size:13px}
.regbox .card{border-bottom:0;padding-top:0}
@media (max-width:520px){.card,.card-edit{grid-template-columns:1fr 1fr}}
.rail .rule{font-size:12px;color:var(--muted);margin:0}
@media (max-width:520px){.hist li{grid-template-columns:1fr;gap:0}.two{grid-template-columns:1fr}}
</style>

<div class="app">
  <div class="top">
    <h1>Реестр сайтов студии</h1>
    <div class="legend">
      <span><i class="dot red"></i>красный флаг или просрочено</span>
      <span><i class="dot orange"></i>срок через 3 дня или меньше</span>
      <span><i class="dot green"></i>в срок или выполнено</span>
      <span><i class="dot grey"></i>проект на паузе</span>
    </div>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="main">
    <aside class="panel sites" aria-label="Проекты">
      <div class="sites-head"><h3>Проекты</h3><button class="btn ghost" id="add-site-toggle" type="button">+ Проект</button></div>
      <div class="tabs" id="site-tabs" role="tablist"></div>
      <form class="siteform" id="site-form" hidden>
        <input id="sf-name" type="text" placeholder="Домен, например example.com" required>
        <input id="sf-client" type="text" placeholder="Заказчик студии">
        <div class="two">
          <select id="sf-level" aria-label="Уровень"><option value="A">Уровень A</option><option value="B" selected>Уровень B</option><option value="C">Уровень C</option></select>
          <input id="sf-platform" type="text" placeholder="Платформа" value="Webflow" aria-label="Платформа">
        </div>
        <input id="sf-segment" type="text" placeholder="Сегмент и рынок, например люкс, США">
        <div class="two">
          <input id="sf-executor" type="text" placeholder="Исполнитель" aria-label="Исполнитель">
          <input id="sf-reviewer" type="text" placeholder="Проверяющий" aria-label="Проверяющий">
        </div>
        <label class="lbl" for="sf-start">Дата старта</label>
        <input id="sf-start" type="date">
        <label class="chk"><input id="sf-template" type="checkbox" checked> Добавить типовые задачи по гейтам</label>
        <button class="btn" type="submit">Добавить проект</button>
      </form>
      <div id="site-list"><div class="note">Загружаем проекты…</div></div>
    </aside>
    <section class="panel site" id="site" aria-live="polite"><div class="empty">Выберите проект слева.</div></section>
  </div>
  <p class="muted" id="conn" style="margin:0;font-size:12px"></p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const FW = {
    1:{name:"Фреймворк 1 · Техническая оптимизация", gates:["Сайт принят","Аудит принят","Объём согласован","Готово к публикации","Сдача","Стабильность"]},
    2:{name:"Фреймворк 2 · SEO-продвижение", gates:["Сайт в продвижении","Семантика утверждена","Структура запущена","Контент и AI","Первый результат","Ежемесячный цикл"]}
  };
  function template(level){
    const A=level==="A",C=level==="C",ai=A?10:C?3:5;
    return [
      [1,0,"Доступы от студии: CMS, хостинг видео, Search Console, Google Analytics","Менеджер",2],[1,0,"Контакт в студии и границы работ","Менеджер",2],[1,0,"Резервная копия сайта","Тех. специалист",3],
      [1,1,"Замеры: главная + 5 страниц, телефон и компьютер, медиана из 3 прогонов","Тех. специалист",7],[1,1,"Обход адресов и чек-лист аудита на 100%","SEO-специалист",7],
      [1,1,"Приоритеты P1–P3 по находкам, флаги по порогам","SEO-специалист",8],[1,1,"Проверка гейта 1 по критериям","Проверяющий",9,1],[1,1,"Отчёт аудита для студии","Менеджер",10],
      [1,2,"Студия утвердила план задач и пороги","Студия",14],[1,2,"Материалы и решения от студии для P1","Студия",14],
      [1,3,"Все задачи P1 на тестовой версии","Тех. специалист",28],[1,3,"Тестовая версия: метрики в порогах, визуальное сравнение, редиректы, 0 битых ссылок, разметка без ошибок","Тех. специалист",29],
      [1,3,"Проверка гейта 3 по критериям","Проверяющий",30,1],[1,3,"Студия посмотрела тестовую версию и дала добро на публикацию","Студия",31],

      [1,5,"Контроль через 30 дней: регрессии, индексация, склейка адресов","Тех. специалист",64],[1,5,"Проверка гейта 5","Проверяющий",65,1],

      [2,1,"Проверка гейта 1","Проверяющий",27,1],...(A?[[2,1,"Ядро утверждено студией","Студия",30]]:[]),
      [2,2,"Страницы приоритета 1 по стандартам контента","Автор контента",45],[2,2,"Внутренние ссылки и отправка новых страниц на индексацию","SEO-специалист",46],[2,2,"Проверка гейта 2","Проверяющий",47,1],
      ...(C?[]:[[2,3,"Блог и первые статьи по плану","Автор контента",60]]),[2,3,"FAQ и блок фактов о компании","Автор контента",60],
      [2,3,"Структурированные данные по типам страниц; Google Business Profile, если бизнес локальный","SEO-специалист",62],[2,3,"Контент-план на 3 месяца","SEO-специалист",62],[2,3,"Проверка гейта 3","Проверяющий",64,1],
      [2,4,"Отчёт за 90 дней после гейта 2","Аналитик",137]

    const onErr=e=>{clearTimeout(timer);$("conn").textContent="Связь с хранилищем прервалась: "+(e&&e.message||"ошибка")+". Перезагрузите страницу.";};
    db.collection("sites").onSnapshot(snap=>{sites=snap.docs.map(d=>({id:d.id,...d.data()}));sitesLoaded=true;settle(snap.metadata);render();},onErr);
    db.collection("tasks").onSnapshot(snap=>{tasks=snap.docs.map(d=>({id:d.id,...d.data()}));tasksLoaded=true;settle(snap.metadata);render();},onErr);
    db.collection("history").orderBy("at","desc").limit(500).onSnapshot(snap=>{history=snap.docs.map(d=>({id:d.id,...d.data()}));render();},onErr);
  });
})();
</script>
