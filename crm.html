<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Реестр сайтов студии</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: рабочая панель — сводка сверху, слева список сайтов, справа карточка сайта: гейты двух фреймворков и задачи по гейтам */
:root{
  --bg:#eef0f3; --surface:#ffffff; --sunk:#f5f6f8; --fg:#151a24; --muted:#5d6574; --line:#dcdfe5;
  --ink:#1e3a8a;
  --red:#c42b2b; --red-bg:#fde8e8; --orange:#c25e00; --orange-bg:#feefdc; --green:#1b7f47; --green-bg:#e2f3e9; --grey:#8a919e; --grey-bg:#eceef1;
  --f-body:"Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e121a; --surface:#161c27; --sunk:#121722; --fg:#e7eaf0; --muted:#98a0ae; --line:#283041;
  --ink:#8fa8ff;
  --red:#ff7676; --red-bg:#3b1a1d; --orange:#ffad5c; --orange-bg:#3a2813; --green:#5fd394; --green-bg:#13301f; --grey:#7c8494; --grey-bg:#1f2533; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e121a; --surface:#161c27; --sunk:#121722; --fg:#e7eaf0; --muted:#98a0ae; --line:#283041;
  --ink:#8fa8ff;
  --red:#ff7676; --red-bg:#3b1a1d; --orange:#ffad5c; --orange-bg:#3a2813; --green:#5fd394; --green-bg:#13301f; --grey:#7c8494; --grey-bg:#1f2533; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-size:18px;font-weight:700}
h3{margin:0;font-size:13px;font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.red{background:var(--red)}.dot.orange{background:var(--orange)}.dot.green{background:var(--green)}.dot.grey{background:var(--grey)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer}
.tile b{font:600 26px/1.1 var(--f-mono)}
.tile span{font-size:12px;color:var(--muted)}
.tile.red b{color:var(--red)}.tile.orange b{color:var(--orange)}.tile.green b{color:var(--green)}
.tile:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.sites{display:flex;flex-direction:column}
.sites-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.site-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.site-item:last-child{border-bottom:0}
.site-item[aria-current="true"]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--ink)}
.site-item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-item .sub{grid-column:2/4;font-size:12px;color:var(--muted)}
.badge{font:600 11px/1 var(--f-mono);padding:4px 6px;border-radius:4px;background:var(--grey-bg);color:var(--muted)}
.counts{display:flex;gap:6px}
.cnt{font:600 11px/1 var(--f-mono);padding:3px 6px;border-radius:999px}
.cnt.red{background:var(--red-bg);color:var(--red)}.cnt.orange{background:var(--orange-bg);color:var(--orange)}
.site{display:flex;flex-direction:column;gap:0}
.site-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;justify-content:space-between}
.site-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.site-meta a{color:var(--ink)}
.rails{display:grid;grid-template-columns:1fr;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.rail{display:flex;flex-direction:column;gap:6px}
.rail-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.gate{border:1px solid var(--line);border-radius:6px;padding:7px 8px;display:flex;flex-direction:column;gap:3px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.gate .g{font:600 11px/1 var(--f-mono);color:var(--muted)}
.gate .t{font-size:12px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gate .p{font:500 11px/1 var(--f-mono);color:var(--muted)}
.gate.done{background:var(--green-bg);border-color:var(--green)}
.gate.done .g{color:var(--green)}
.gate.red{border-color:var(--red);box-shadow:inset 0 3px 0 var(--red)}
.gate.orange{border-color:var(--orange);box-shadow:inset 0 3px 0 var(--orange)}
.gate.green{border-color:var(--green);box-shadow:inset 0 3px 0 var(--green)}
.gate.empty{opacity:.55}
.gate.current .g::after{content:" · сейчас";color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.groups{display:flex;flex-direction:column}
.fw-title{padding:14px 18px 6px;font:600 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.group{padding:0 18px 10px}
.group-head{display:flex;align-items:center;gap:10px;padding:8px 0 6px;border-bottom:1px solid var(--line)}
.group-head .p{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:9px 0 9px 10px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.task:last-child{border-bottom:0}
.task.red{border-left-color:var(--red);background:linear-gradient(90deg,var(--red-bg),transparent 40%)}
.task.orange{border-left-color:var(--orange);background:linear-gradient(90deg,var(--orange-bg),transparent 40%)}
.task.green{border-left-color:var(--green)}
.task.done{border-left-color:var(--grey)}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task input[type=checkbox]{width:18px;height:18px;margin:1px 0 0;accent-color:var(--green);cursor:pointer}
.task .body{display:flex;flex-direction:column;gap:3px;min-width:0}
.task .title{overflow-wrap:anywhere}
.task .info{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);align-items:center}
.status{font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:4px;white-space:nowrap}
.status.red{background:var(--red-bg);color:var(--red)}.status.orange{background:var(--orange-bg);color:var(--orange)}.status.green{background:var(--green-bg);color:var(--green)}.status.done{background:var(--grey-bg);color:var(--muted)}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.date{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:2px 4px;font:12px var(--f-mono);width:128px}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 7px;font-size:12px;cursor:pointer;color:var(--muted)}
.icon.on{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.icon.danger{color:var(--red)}
.btn.danger{color:var(--red);border-color:var(--red)}
.add{padding:14px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:0 0 10px 10px}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form input[type=text],.form input[type=url],.form select,.form input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0}
.form .grow{flex:1 1 220px}
.btn{border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.note{padding:12px 14px;font-size:13px;color:var(--muted)}
.empty{padding:28px 18px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}
.siteform{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.siteform input,.siteform select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;width:100%}
@media (max-width:900px){.main{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.rail-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.task{grid-template-columns:22px minmax(0,1fr)}.actions{grid-column:2;justify-content:flex-start}}
@media (prefers-reduced-motion:no-preference){.task,.gate{transition:background .2s,border-color .2s}}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;border-radius:6px;padding:5px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--sunk);color:var(--fg);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:12px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.chk input{width:auto}
.siteform{border-bottom:1px solid var(--line);border-top:0}
.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pstatus{font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:4px;background:var(--green-bg);color:var(--green)}
.pstatus.paused{background:var(--grey-bg);color:var(--muted)}
.pstatus.done{background:var(--sunk);color:var(--ink)}
.pstatus.archived{background:var(--grey-bg);color:var(--muted)}
.head-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.head-actions .btn{padding:5px 10px;font-size:13px}
.banner{padding:10px 18px;background:var(--grey-bg);border-bottom:1px solid var(--line);font-size:13px;display:flex;flex-wrap:wrap;gap:4px}
.inline-form{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--sunk)}
.inline-form input,.inline-form select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0;flex:1 1 160px}
.inline-form .grow{flex:3 1 260px}
.closed{color:var(--green)}
.cnt.grey{background:var(--grey-bg);color:var(--muted)}
.status.paused{background:var(--grey-bg);color:var(--muted)}
.task.paused{border-left-color:var(--grey)}
.history{border-top:1px solid var(--line);padding:12px 18px}
.history summary{cursor:pointer;font-weight:600;font-size:13px}
.hist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.hist li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;font-size:13px}

.prio{font:600 11px/1 var(--f-mono);padding:3px 6px;border-radius:4px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.prio.P1{border-color:var(--red);color:var(--red)}.prio.P2{border-color:var(--orange);color:var(--orange)}
.rev{font:600 11px/1 var(--f-mono);padding:3px 6px;border-radius:4px;background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.card{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 16px;font-size:13px}
.card>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.card .k,.card-edit .k{font-size:11px;color:var(--muted)}
.card .v{overflow-wrap:anywhere}
.card .v.red{color:var(--red);font-weight:600}.card .v.orange{color:var(--orange);font-weight:600}.card .v.none{color:var(--muted)}
.card .warn{grid-column:1/-1;color:var(--red);font-size:12px}
.card-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 12px;width:100%}
.card-edit label{display:flex;flex-direction:column;gap:2px;min-width:0}
.card-edit input{width:100%;flex:none!important}
.regbox{border-bottom:1px solid var(--line)}
.regbox summary{cursor:pointer;padding:10px 18px;font-weight:600;font-size:13px}
.regbox .card{border-bottom:0;padding-top:0}
@media (max-width:520px){.card,.card-edit{grid-template-columns:1fr 1fr}}
.rail .rule{font-size:12px;color:var(--muted);margin:0}
@media (max-width:520px){.hist li{grid-template-columns:1fr;gap:0}.two{grid-template-columns:1fr}}
.viewbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px}
.viewbar:empty{display:none}
.demo-tag{font:600 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;padding:5px 8px;border-radius:4px;background:var(--orange-bg);color:var(--orange)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.btn.sm{padding:4px 10px;font-size:12px}
.rev.appr{color:var(--green);background:var(--green-bg);border-color:transparent}
.icon.has{color:var(--ink);border-color:var(--ink)}
.thread{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding:8px 10px;background:var(--sunk);border-radius:6px;border:1px solid var(--line)}
.cmt{display:flex;flex-direction:column;gap:2px;font-size:13px;padding:6px 8px;border-radius:6px;background:var(--surface);border-left:3px solid var(--ink)}
.cmt.studio{border-left-color:var(--orange)}
.cmt-h{font-size:12px}.cmt-t{white-space:pre-wrap;overflow-wrap:anywhere}
.cmt-form{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.cmt-form textarea,.inline-form textarea{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font:inherit;color:inherit;resize:vertical}
.inline-form .wide{flex:1 1 100%;display:flex;flex-direction:column;gap:2px}
.card-edit .wide{grid-column:1/-1}
.cnt.plain{background:var(--sunk);color:var(--fg)}
.gate.cur{border-color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.gate.next{opacity:.7}
.reports{margin:6px 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.reports a{color:var(--ink)}
details.plain>summary{cursor:pointer;list-style:revert}
.mini{padding:6px 0}.mini h3{font-size:12px;color:var(--muted);margin-bottom:4px}
.mini ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:13px}
.mini li.ok{color:var(--muted)}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toast{display:flex;gap:12px;align-items:center}
.toast-go{border:1px solid var(--bg);background:transparent;color:var(--bg);border-radius:5px;padding:3px 9px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
@keyframes flash{0%,60%{box-shadow:inset 0 0 0 2px var(--ink);background:var(--sunk)}100%{box-shadow:none}}
.task.flash{animation:flash 2.4s ease-out}
@media (prefers-reduced-motion:reduce){.task.flash{animation:none;box-shadow:inset 0 0 0 2px var(--ink)}}
</style>

<div class="app">
  <div class="top">
    <h1 id="title">Реестр сайтов студии</h1>
    <div class="legend" id="legend">
      <span><i class="dot red"></i>красный флаг или просрочено</span>
      <span><i class="dot orange"></i>срок через 3 дня или меньше</span>
      <span><i class="dot green"></i>в срок или выполнено</span>
      <span><i class="dot grey"></i>проект на паузе</span>
    </div>
  </div>
  <div class="viewbar" id="viewbar"></div>
  <div class="tiles" id="tiles"></div>
  <div class="main">
    <aside class="panel sites" aria-label="Проекты">
      <div class="sites-head"><h3>Проекты</h3><button class="btn ghost" id="add-site-toggle" type="button">+ Проект</button></div>
      <div class="tabs" id="site-tabs" role="tablist"></div>
      <form class="siteform" id="site-form" hidden>
        <input id="sf-name" type="text" placeholder="Домен, например example.com" required>
        <input id="sf-client" type="text" placeholder="Заказчик студии">
        <div class="two">
          <select id="sf-level" aria-label="Уровень"><option value="A">Уровень A</option><option value="B" selected>Уровень B</option><option value="C">Уровень C</option></select>
          <input id="sf-platform" type="text" placeholder="Платформа" value="Webflow" aria-label="Платформа">
        </div>
        <input id="sf-segment" type="text" placeholder="Сегмент и рынок, например люкс, США">
        <div class="two">
          <input id="sf-executor" type="text" placeholder="Исполнитель" aria-label="Исполнитель">
          <input id="sf-reviewer" type="text" placeholder="Проверяющий" aria-label="Проверяющий">
        </div>
        <label class="lbl" for="sf-start">Дата старта</label>
        <input id="sf-start" type="date">
        <label class="chk"><input id="sf-template" type="checkbox" checked> Добавить типовые задачи по гейтам</label>
        <button class="btn" type="submit">Добавить проект</button>
      </form>
      <div id="site-list"><div class="note">Загружаем проекты…</div></div>
    </aside>
    <section class="panel site" id="site" aria-live="polite"><div class="empty">Выберите проект слева.</div></section>
  </div>
  <p class="muted" id="conn" style="margin:0;font-size:12px"></p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const FW = {
    1:{name:"Фреймворк 1 · Техническая оптимизация", gates:["Сайт принят","Аудит принят","Объём согласован","Готово к публикации","Сдача","Стабильность"]},
    2:{name:"Фреймворк 2 · SEO-продвижение", gates:["Сайт в продвижении","Семантика утверждена","Структура запущена","Контент и AI","Первый результат","Ежемесячный цикл"]}
  };
  // [фреймворк, гейт, название, ответственный, день от старта, проверка гейта, утверждение студией]
  function template(level){
    const A=level==="A",C=level==="C",ai=A?10:C?3:5;
    return [

      tile("green",pct+"%",`выполнено в активных (${done} из ${all.length})`,()=>{filter="done";render();}));
  }

  // ---------- вид студии ----------
  function studioAct(t,val){
    if(!canWrite){toast("У вас доступ только для просмотра");render();return;}
    write(()=>db.doc("studio/"+t.id).set({site:t.site,done:val,at:nowISO(),by:me||(DEMO?"studio":"")}),val?(t.approval?"Утверждено":"Отмечено как выполненное"):"Возвращено в работу");
  }
  function studioRow(t,showSite){
    const s=status(t);const th=thread(t,"studio");const site=siteOf(t);
    const team=t.done&&!t.byStudio;
    const act=t.done?(team?h("span",{class:"muted",text:"Закрыто подрядчиком"}):(canWrite?h("button",{class:"btn ghost sm",type:"button",onclick:()=>studioAct(t,false)},"Вернуть"):null))
      :(canWrite?h("button",{class:"btn sm",type:"button",onclick:()=>studioAct(t,true)},t.approval?"Утвердить":"Готово"):null);
    return h("div",{class:"task "+s.c,id:"t-"+t.id},
      h("i",{class:"dot "+(s.c==="done"?"grey":s.c),style:"margin-top:6px"}),
      h("div",{class:"body"},h("span",{class:"title",text:t.title}),
        h("span",{class:"info"},showSite&&site?h("b",{text:site.name}):null,t.approval?h("span",{class:"rev appr",text:"Утверждение"}):null,h("span",{class:"status "+s.c,text:s.label}),
          t.due&&!t.done?h("span",{text:"срок "+fmtDate(t.due)}):null,t.done&&t.doneAt?h("span",{class:"closed",text:fmtStamp(t.doneAt)}):null,th.btn),th.box),
      h("div",{class:"actions"},act));
  }
  function renderStudioTiles(){
    const act=new Set(sites.filter(s=>pstat(s)==="active").map(s=>s.id));
    const mine=tasks.filter(t=>isStudioTask(t)&&act.has(t.site));const open=mine.filter(t=>!t.done);
    const over=open.filter(t=>status(t).c==="red").length,soon=open.filter(t=>status(t).c==="orange").length,appr=open.filter(t=>t.approval).length;
    const tile=(cls,num,label,fn)=>h("button",{class:"tile "+cls,type:"button",onclick:fn},h("b",{text:num}),h("span",{text:label}));
    $("tiles").replaceChildren(
      tile("",String(act.size),"сайтов в работе",()=>{studioAll=false;tab="active";render();}),
      tile("",String(open.length),"ждут от студии — все сайты",()=>{studioAll=true;render();}),
      tile("red",String(over),"просрочено",()=>{studioAll=true;render();}),
      tile("orange",String(soon),"срок через 3 дня или меньше",()=>{studioAll=true;render();}),
      tile("",String(appr),"ждут утверждения",()=>{studioAll=true;render();}));
  }
  function renderStudioAll(){
    const act=new Set(sites.filter(s=>pstat(s)==="active").map(s=>s.id));
    const open=tasks.filter(t=>isStudioTask(t)&&!t.done&&act.has(t.site)).sort((a,b)=>String(a.due||"9").localeCompare(String(b.due||"9")));
    return [h("div",{class:"site-head"},h("div",null,h("h2",{text:"Ждёт от студии"}),h("div",{class:"site-meta"},h("span",{text:"Все сайты в работе, по сроку"})))),
      h("div",{class:"groups"},h("div",{class:"group"},...(open.length?open.map(t=>studioRow(t,true)):[h("div",{class:"empty",text:"Сейчас от студии ничего не нужно."})])))];
  }
  function renderStudioSite(s){
    const st=siteTasks(s.id),ps=pstat(s);
    const mine=st.filter(isStudioTask),open=mine.filter(t=>!t.done).sort((a,b)=>(!!b.approval-!!a.approval)||String(a.due||"9").localeCompare(String(b.due||"9"))),done=mine.filter(t=>t.done).sort((a,b)=>String(b.doneAt||"").localeCompare(String(a.doneAt||"")));
    const team=st.filter(t=>!isStudioTask(t));
    const head=h("div",{class:"site-head"},h("div",{style:"min-width:0"},h("div",{class:"title-row"},h("h2",{text:s.name}),h("span",{class:"pstatus "+ps,text:PSTATUS[ps]})),
      h("div",{class:"site-meta"},s.client?h("span",{text:"Заказчик: "+s.client}):null,h("span",{text:"Уровень "+(s.level||"—")}),s.platform?h("span",{text:s.platform}):null,s.startDate?h("span",{text:"Старт "+fmtDate(s.startDate)}):null,
        s.url&&s.url!=="#"?h("a",{href:s.url,target:"_blank",rel:"noopener",text:"открыть сайт"}):null)),
      h("div",{class:"head-actions"},h("span",{class:"muted mono",text:`работы подрядчика: ${team.filter(t=>t.done).length}/${team.length}`})));
    const parts=[head];
    if(ps==="paused")parts.push(h("div",{class:"banner"},h("b",{text:"На паузе"}),s.pauseNote?h("span",{text:" · "+s.pauseNote}):null));
    parts.push(rails(st,true));
    parts.push(h("div",{class:"groups"},
      h("div",{class:"fw-title",text:"Ждёт от студии"}),
      h("div",{class:"group"},...(open.length?open.map(t=>studioRow(t,false)):[h("div",{class:"empty",text:"По этому сайту от студии сейчас ничего не нужно."})])),
      h("div",{class:"fw-title",text:"Отчёты"}),
      h("div",{class:"group"},(s.reports&&s.reports.length)?h("ul",{class:"reports"},...s.reports.map(r=>h("li",null,h("a",{href:r.url,target:"_blank",rel:"noopener",text:r.title})))):h("p",{class:"note",text:"Отчёты появятся после аудита."})),
      h("details",{class:"group plain"},h("summary",{class:"fw-title"},`Работы подрядчика · ${team.filter(t=>t.done).length}/${team.length}`),
        ...[1,2].flatMap(fw=>[0,1,2,3,4,5].map(g=>{const l=team.filter(t=>t.fw===fw&&t.gate===g);if(!l.length)return null;
          return h("div",{class:"mini",id:`g-${fw}-${g}`},h("h3",{text:`Ф${fw} · Гейт ${g}. ${FW[fw].gates[g]}`}),h("ul",null,...l.map(t=>h("li",{class:t.done?"ok":""},(t.done?"✓ ":"○ ")+t.title))));}))),
      done.length?h("details",{class:"group plain"},h("summary",{class:"fw-title"},`Сделано студией · ${done.length}`),...done.map(t=>studioRow(t,false))):null));
    return parts;
  }

  // ---------- рендер ----------
  function renderSite(){
    const box=$("site");
    if(studioView()&&studioAll){box.replaceChildren(...renderStudioAll());return;}
    const pool=sites.filter(s=>tab==="all"||pstat(s)===tab);
    const s=sites.find(x=>x.id===selected)||pool[0]||sites[0];
    if(!s){box.replaceChildren(h("div",{class:"empty",text:sitesLoaded?(studioView()?"Сайтов пока нет.":"Добавьте проект, чтобы начать."):"Загружаем…"}));return;}
    selected=s.id;
    box.replaceChildren(...(studioView()?renderStudioSite(s):renderTeamSite(s)));
    if(!studioView())fillGates();
  }
  function render(){
    const a=document.activeElement,keepId=a&&a.id,keepVal=keepId&&a.value;
    const ta=a&&a.tagName==="TEXTAREA"&&a.closest(".thread")?a.value:null;
    const hist=document.querySelector(".history"),histOpen=hist&&hist.open;
    const det=[...document.querySelectorAll("details.plain")].map(d=>d.open);
    rebuild();renderTop();(studioView()?renderStudioTiles:renderTeamTiles)();renderSites();renderSite();
    if(histOpen){const n=document.querySelector(".history");if(n)n.open=true;}
    document.querySelectorAll("details.plain").forEach((d,i)=>{if(det[i])d.open=true;});
    if(keepId&&$(keepId)){const el=$(keepId);if(el.type!=="checkbox"&&keepVal!=null)el.value=keepVal;el.focus();}
    if(ta!=null){const t=document.querySelector(".thread textarea");if(t){t.value=ta;t.focus();}}
    resolveNames();
  }

  $("add-site-toggle").addEventListener("click",()=>{const f=$("site-form");f.hidden=!f.hidden;if(!f.hidden){$("sf-start").value=iso(today());$("sf-name").focus();}});
  $("site-form").addEventListener("submit",e=>{e.preventDefault();if(!db){toast("Хранилище недоступно: войдите в claude.ai");return;}
    const name=$("sf-name").value.trim();if(!name)return;
    const start=$("sf-start").value||iso(today());
    const data={name,url:/^https?:\/\//.test(name)?name:"https://"+name,client:$("sf-client").value.trim(),level:$("sf-level").value,platform:$("sf-platform").value.trim(),segment:$("sf-segment").value.trim(),reports:[],startDate:start,status:"active",createdBy:me||"",createdAt:nowISO()};
    const priv={executor:$("sf-executor").value.trim(),reviewer:$("sf-reviewer").value.trim()};
    const withTpl=$("sf-template").checked;
    write(async()=>{
      const ref=await db.collection("sites").add(data);
      if(priv.executor||priv.reviewer)await db.doc("siteInternal/"+ref.id).set(priv);
      log(ref.id,"p_created",{title:name});
      if(withTpl){const base=parse(start);for(const [fw,gate,title,owner,off,rev,appr] of template(data.level)){await db.collection("tasks").add({site:ref.id,fw,gate,title,owner,due:iso(addDays(base,off)),review:!!rev,approval:!!appr,done:false,doneAt:"",doneBy:"",createdBy:me||"",createdAt:nowISO()});}}
      selected=ref.id;tab="active";$("site-form").reset();$("site-form").hidden=true;},"Проект добавлен");});

  // ---------- демо-режим: локальное хранилище в браузере ----------
  const DEMO_KEY="crm-demo-v2";
  function demoSeed(){
    const T=today(),D={sites:{},siteInternal:{},tasks:{},internal:{},studio:{},comments:{},history:{}};let n=0;
    const mk=(id,site,lvl,startOff,doneUntil,extra)=>{
      const start=addDays(T,-startOff);
      D.sites[id]={name:site.name,url:"#",client:site.client,level:lvl,platform:"Webflow",segment:site.segment,startDate:iso(start),status:site.status||"active",reports:site.reports||[],pauseNote:site.pauseNote||"",pausedAt:site.status==="paused"?addDays(T,-3).toISOString():""};
      D.siteInternal[id]=site.priv||{};
      for(const [fw,gate,title,owner,off,rev,appr] of template(lvl)){const tid=id+"-"+(++n);
        const done=(fw===1&&gate<doneUntil[0])||(fw===2&&gate<doneUntil[1]);
        D.tasks[tid]={site:id,fw,gate,title,owner,due:iso(addDays(start,off)),review:!!rev,approval:!!appr,done:done&&owner!=="Студия",doneAt:done?addDays(start,off).toISOString():"",doneBy:done?"team":"",createdAt:start.toISOString()};
        if(done&&owner==="Студия"){D.studio[tid]={site:id,done:true,at:addDays(start,off).toISOString(),by:"studio"};}
        if(!done&&parse(D.tasks[tid].due)<T)D.tasks[tid].due=iso(addDays(T,5+(n%9)));
      }
      (extra||(()=>{}))(id,start);
    };
    mk("aurora",{name:"aurora-villas.demo",client:"Aurora Villas (вымышленный)",segment:"люкс, недвижимость, США",reports:[{title:"Отчёт аудита (пример)",url:"#"},{title:"Семантическое ядро (пример)",url:"#"}],
      priv:{executor:"Анна",reviewer:"Игорь",contact:"Мария, менеджер студии",media:"Webflow; видео — Vimeo",niche:"аренда вилл",market:"США, английский",scoreBefore:"41",lcpBefore:"6,2 с",weightBefore:"18 МБ",nextCheck:iso(addDays(T,4))}},"A",34,[3,1],(id,start)=>{
      let i=0;for(const [tid,t] of Object.entries(D.tasks)){if(t.site!==id||t.fw!==1||t.gate!==3)continue;i++;
        if(i===1){D.internal[tid]={prio:"P1",flag:true,note:"видео первого экрана 14 МБ"};t.due=iso(addDays(T,-1));}
        if(i===2)D.internal[tid]={prio:"P2",flag:false,note:""};}
      for(const [tid,t] of Object.entries(D.tasks)){if(t.site===id&&t.owner==="Студия"&&!t.done&&!D.studio[tid]){t.due=iso(addDays(T,2));
        D.comments["c1"]={site:id,task:tid,text:"Можно ли пережать видео без потери качества на больших экранах?",side:"studio",by:"studio",at:addDays(T,-1).toISOString()};
        D.comments["c2"]={site:id,task:tid,text:"Да: делаем две версии, 1080p для компьютера и 720p для телефона. Разница на глаз не видна.",side:"team",by:"team",at:addDays(T,-1).toISOString()};break;}}});
    mk("nord",{name:"atelier-nord.demo",client:"Atelier Nord (вымышленный)",segment:"дизайн интерьеров, Европа",priv:{executor:"Олег",reviewer:"Анна",niche:"дизайн интерьеров",market:"Германия, английский",scoreBefore:"55"}},"B",9,[1,0],(id)=>{
      for(const [tid,t] of Object.entries(D.tasks)){if(t.site===id&&t.fw===1&&t.gate===1&&t.review){t.done=false;t.doneAt="";}}});
    mk("marina",{name:"casa-marina.demo",client:"Casa Marina (вымышленный)",segment:"ресторан, локальный бизнес",status:"paused",pauseNote:"ждём доступы от заказчика",priv:{executor:"Игорь",reviewer:"Олег"}},"C",5,[0,0]);
    return D;
  }
  function localDb(){
    let data;try{data=JSON.parse(localStorage.getItem(DEMO_KEY)||"null");}catch(e){}
    if(!data)data=demoSeed();
    const subs=[];
    const save=()=>{try{localStorage.setItem(DEMO_KEY,JSON.stringify(data));}catch(e){}subs.forEach(f=>f());};
    save();
    const snap=(name,q)=>{let arr=Object.entries(data[name]||{}).map(([id,v])=>({id,v}));
      if(q.ob)arr.sort((a,b)=>String(a.v[q.ob]||"").localeCompare(String(b.v[q.ob]||""))*(q.dir==="desc"?-1:1));if(q.lim)arr=arr.slice(0,q.lim);
      return {docs:arr.map(x=>({id:x.id,exists:true,data:()=>x.v})),metadata:{fromCache:false,hasPendingWrites:false}};};
    const query=(name,q)=>({orderBy:(f,d)=>query(name,{...q,ob:f,dir:d}),limit:n=>query(name,{...q,lim:n}),
      onSnapshot:cb=>{const f=()=>cb(snap(name,q));subs.push(f);setTimeout(f,0);return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1);};},
      add:async v=>{const id=Math.random().toString(36).slice(2,12);(data[name]=data[name]||{})[id]=JSON.parse(JSON.stringify(v));save();return {id};}});
    return {collection:name=>query(name,{}),doc:path=>{const [c,id]=path.split("/");return {
      set:async v=>{(data[c]=data[c]||{})[id]=JSON.parse(JSON.stringify(v));save();},
      update:async v=>{if(!data[c]||!data[c][id])throw new Error("нет документа");data[c][id]={...data[c][id],...v};save();},
      delete:async()=>{if(data[c])delete data[c][id];save();}};},
      reset:()=>{data=demoSeed();save();}};
  }
  function resetDemo(){if(db&&db.reset){db.reset();selected=null;toast("Демо-данные сброшены");}}

  // ---------- подключение ----------
  function subscribe(){
    const timer=setTimeout(()=>{$("conn").textContent="Данные пока не загрузились. Проверьте соединение — страница обновится сама, когда хранилище ответит.";},10000);
    const settle=meta=>{if(!meta.fromCache){clearTimeout(timer);if(!DEMO)$("conn").textContent="";}};
    const onErr=e=>{clearTimeout(timer);$("conn").textContent="Связь с хранилищем прервалась: "+(e&&e.message||"ошибка")+". Перезагрузите страницу.";};
    const map=(snap)=>Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));
    db.collection("sites").onSnapshot(snap=>{rawSites=snap.docs.map(d=>({id:d.id,...d.data()}));sitesLoaded=true;settle(snap.metadata);render();},onErr);
    db.collection("tasks").onSnapshot(snap=>{rawTasks=snap.docs.map(d=>({id:d.id,...d.data()}));tasksLoaded=true;settle(snap.metadata);render();},onErr);
    db.collection("studio").onSnapshot(snap=>{marks=map(snap);render();},onErr);
    db.collection("comments").onSnapshot(snap=>{comments=snap.docs.map(d=>({id:d.id,...d.data()}));render();},onErr);
    if(isAdmin||DEMO){
      db.collection("internal").onSnapshot(snap=>{internal=map(snap);render();},onErr);
      db.collection("siteInternal").onSnapshot(snap=>{siteInt=map(snap);render();},onErr);
      db.collection("history").orderBy("at","desc").limit(500).onSnapshot(snap=>{history=snap.docs.map(d=>({id:d.id,...d.data()}));render();},onErr);
    }
  }

  render();
  if(DEMO){
    try{viewAs=localStorage.getItem("crm-view")||"team";}catch(e){}
    db=localDb();isAdmin=true;canWrite=true;
    $("conn").textContent="Демо-режим. Боевой трекер с общей базой и разделением доступа работает на claude.ai.";
    subscribe();render();
  }else{
    const use=n=>window.claude.use(n);
    Promise.all([use("user"),use("db")]).then(async([u,d])=>{
      user=u;db=d;
      if(u){try{me=await u.id();}catch(e){}try{isAdmin=await u.canEdit();}catch(e){}try{const c=await u.can("data.write");canWrite=c!==false;}catch(e){}}
      viewAs=isAdmin?"team":"studio";
      if(isAdmin){try{const v=localStorage.getItem("crm-view");if(v==="studio")viewAs="studio";}catch(e){}}
      if(!db){$("conn").textContent="Хранилище недоступно: войдите в claude.ai под своим аккаунтом, чтобы видеть и отмечать задачи.";sitesLoaded=tasksLoaded=true;render();return;}
      subscribe();render();
    });
  }
})();

</script>
